# Shared build server: 16 cores / 121 GB RAM host, but THIS agent session is capped at 8 GB
# (systemd memory cgroup). Gradle + Kotlin daemons + one emulator must fit in it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Kotlin compiler daemon heap; this session runs in an 8 GB memory cgroup shared with the emulator.
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# D10: the product name lives here and only here. :core:model generates ProductName.NAME from it,
# :app turns it into @string/app_name. Never write the name literally in code or strings.xml.
murmur.productName=Murmur
