<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmur Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===================================================================
   Murmur design prototype. One file, no build step.
   Layout concept: a gallery of device frames at 1 CSS px = 1 dp.
   Cover display 412 x 960 dp, inner display 750 x 832 dp (see DESIGN.md §2).
   Token values mirror docs/design/tokens.json.
   =================================================================== */

/* Gallery chrome (not part of the app) */
:root{
  --g-bg:#E9EBEF; --g-fg:#14161B; --g-mute:#596070; --g-line:#D3D7DE; --g-card:#F6F7F9;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --g-bg:#0B0C0F; --g-fg:#E9EBEF; --g-mute:#9AA1AE; --g-line:#2A2D35; --g-card:#15171B; color-scheme:dark; }
}
:root[data-theme="dark"]{ --g-bg:#0B0C0F; --g-fg:#E9EBEF; --g-mute:#9AA1AE; --g-line:#2A2D35; --g-card:#15171B; color-scheme:dark; }

/* App tokens: light (default) */
.screen{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#EEF0F4; --surface-3:#E2E5EB;
  --ink:#14161B; --ink-2:#464C59; --ink-3:#6B7280; --ink-4:#A3A9B5;
  --line:#E4E7EC; --line-2:#D0D4DC;
  --accent:#2F4BE8; --accent-press:#2539C4; --on-accent:#FFFFFF; --accent-soft:#E8ECFF; --accent-ink:#2238C9;
  --ok:#167A49; --ok-soft:#E3F4EA; --warn:#9A5B00; --warn-soft:#FFF1D6; --err:#C2341F; --err-soft:#FDE9E5;
  --inverse:#14161B; --on-inverse:#F3F4F6; --inverse-2:#A3A9B5; --inverse-accent:#A9B8FF;
  --scrim:rgba(20,22,27,.40);
  --sh-1:0 1px 2px rgba(20,22,27,.06),0 1px 1px rgba(20,22,27,.04);
  --sh-2:0 2px 6px rgba(20,22,27,.08),0 8px 24px rgba(20,22,27,.10);
  --sh-3:0 6px 16px rgba(20,22,27,.12),0 18px 40px rgba(20,22,27,.16);
  --kb:#E6E8EC; --key:#FFFFFF; --key-2:#D3D7DE;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  color-scheme:light;
}
/* App tokens: dark */
.screen.dark{
  --bg:#0F1013; --surface:#17191D; --surface-2:#1F2227; --surface-3:#2A2E35;
  --ink:#ECEEF2; --ink-2:#B9BFCA; --ink-3:#9AA1AE; --ink-4:#646B78;
  --line:#25282F; --line-2:#343843;
  --accent:#8296FF; --accent-press:#9CABFF; --on-accent:#0B1033; --accent-soft:#1D2347; --accent-ink:#B4C1FF;
  --ok:#5FD08F; --ok-soft:#13261B; --warn:#F2B54A; --warn-soft:#2B2110; --err:#FF8A75; --err-soft:#2E1612;
  --inverse:#ECEEF2; --on-inverse:#14161B; --inverse-2:#596070; --inverse-accent:#2F4BE8;
  --scrim:rgba(0,0,0,.56);
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --sh-3:0 6px 16px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.55);
  --kb:#1B1D22; --key:#2C3038; --key-2:#3A3F49;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--g-bg);color:var(--g-fg);font-family:"Onest",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#2F4BE8);outline-offset:2px}

/* ---------- Gallery ---------- */
.g-wrap{padding-inline:clamp(16px,4vw,56px);padding-block:40px 80px;max-width:2400px;margin:0 auto}
.g-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}
.g-head h1{font:600 32px/38px "Onest",sans-serif;letter-spacing:-.6px;margin:0}
.g-head p{margin:6px 0 0;color:var(--g-mute);max-width:70ch;font-size:15px;line-height:22px}
.g-ctrl{display:flex;gap:8px;flex-wrap:wrap}
.g-ctrl button{height:36px;padding:0 14px;border:1px solid var(--g-line);border-radius:999px;font-size:13px;font-weight:500;color:var(--g-fg)}
.g-ctrl button[aria-pressed="true"]{background:var(--g-fg);color:var(--g-bg);border-color:var(--g-fg)}
.g-toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 40px;padding:14px 0;border-block:1px solid var(--g-line);font-size:14px}
.g-toc a{color:var(--g-fg);text-decoration:none;font-weight:500}
.g-toc a:hover{text-decoration:underline}
.g-sec{margin-top:64px}
.g-sec>h2{font:600 22px/28px "Onest",sans-serif;margin:0;letter-spacing:-.3px}
.g-sec>p{color:var(--g-mute);margin:6px 0 24px;max-width:80ch;font-size:14px;line-height:21px}
.g-row{display:flex;flex-wrap:wrap;gap:40px 32px;align-items:flex-start}
.g-item{display:flex;flex-direction:column;gap:10px;min-width:0;max-width:100%}
.g-cap{font-size:13px;line-height:18px;color:var(--g-mute);display:flex;gap:8px;align-items:baseline}
.g-cap b{color:var(--g-fg);font-weight:600}
.g-cap code{font-family:"JetBrains Mono",monospace;font-size:11px}
.g-scroll{max-width:100%;overflow-x:auto}
.frame{border-radius:30px;overflow:hidden;box-shadow:0 0 0 1px var(--g-line),0 20px 50px rgba(20,22,27,.12);flex:none}
.frame.inner{border-radius:22px}
.frame.board{border-radius:20px}
body.solo{background:#fff}
body.solo .g-wrap{padding:0;max-width:none}
body.solo .frame{border-radius:0;box-shadow:none}

/* ---------- Device screen ---------- */
.screen{position:relative;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;display:flex;flex-direction:column;font-size:14px;line-height:20px}
.screen.cover{width:412px;height:960px}
.screen.inner{width:750px;height:832px}
.screen.board{width:max-content;height:auto;padding:32px;background:var(--surface)}
.sb{height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font:500 14px/20px var(--font);color:var(--ink);position:relative;z-index:5}
.sb .punch{position:absolute;left:50%;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#0A0B0D}
.sb-r{display:flex;gap:6px;align-items:center}
.gb{height:20px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:5}
.gb span{width:108px;height:4px;border-radius:2px;background:var(--ink);opacity:.85}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-feature-settings:"zero" 0}

/* Icons */
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i .f{fill:currentColor;stroke:none}
.i.b2{stroke-width:2.25}

/* Type */
.t-display{font:600 44px/48px var(--font);letter-spacing:-1.2px}
.t-h1{font:600 28px/34px var(--font);letter-spacing:-.5px}
.t-h2{font:600 20px/26px var(--font);letter-spacing:-.25px}
.t-h3{font:600 16px/22px var(--font);letter-spacing:-.1px}
.t-bl{font:400 16px/24px var(--font)}
.t-b{font:400 14px/20px var(--font)}
.t-l{font:500 14px/20px var(--font)}
.t-ls{font:500 12px/16px var(--font);letter-spacing:.1px}
.t-cap{font:400 12px/16px var(--font)}
.t-over{font:600 11px/16px var(--font);letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3)}
.t-mono{font:400 12px/16px var(--mono)}
.c2{color:var(--ink-2)} .c3{color:var(--ink-3)} .ca{color:var(--accent-ink)}
h1,h2,h3,p{margin:0}
.bal{text-wrap:balance}

/* App shell */
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.app-row{flex:1;display:flex;min-height:0}
.main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.scroll{flex:1;min-height:0;overflow:hidden;position:relative}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 8px 20px;min-height:64px;flex:none}
.hdr h1{font:600 28px/34px var(--font);letter-spacing:-.5px}
.hdr .acts{display:flex;gap:4px}
.ib{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib.sm{width:40px;height:40px}
.ib.tonal{background:var(--surface-2)}
.topbar{display:flex;align-items:center;gap:4px;padding:4px 8px;min-height:56px;flex:none}
.topbar .ttl{flex:1;min-width:0;font:600 17px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font:400 12px/16px var(--font);color:var(--ink-3)}

/* Bottom navigation (cover) */
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);height:72px;padding:6px 8px 0;background:var(--surface);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3);font:500 12px/16px var(--font);min-height:56px}
.nav .pill{width:56px;height:32px;border-radius:999px;display:grid;place-items:center}
.nav button.on{color:var(--ink)}
.nav button.on .pill{background:var(--ink);color:var(--bg)}
/* Navigation rail (inner) */
.rail{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:var(--surface);border-right:1px solid var(--line)}
.rail .logo{width:48px;height:48px;display:grid;place-items:center;margin-bottom:18px;color:var(--ink)}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3);font:500 12px/16px var(--font);width:80px;padding:4px 0 6px}
.rail .pill{width:56px;height:32px;border-radius:999px;display:grid;place-items:center}
.rail button.on{color:var(--ink)}
.rail button.on .pill{background:var(--ink);color:var(--bg)}

/* Buttons */
.btn{height:52px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/20px var(--font);letter-spacing:-.1px;white-space:nowrap}
.btn.p{background:var(--accent);color:var(--on-accent)}
.btn.s{background:var(--surface-2);color:var(--ink)}
.btn.o{border:1px solid var(--line-2);color:var(--ink)}
.btn.t{height:48px;padding:0 12px;color:var(--accent-ink)}
.btn.d{color:var(--err)}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.38}

/* Chips & badges */
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;font:500 13px/16px var(--font);color:var(--ink-2);white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{height:20px;padding:0 6px;border-radius:var(--r-xs);display:inline-flex;align-items:center;font:500 11px/14px var(--mono);letter-spacing:.3px;white-space:nowrap;flex:none;background:var(--surface-2);color:var(--ink-2)}
.badge.npu{background:var(--accent-soft);color:var(--accent-ink)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--err-soft);color:var(--err)}
.badge.line{background:none;border:1px solid var(--line-2);color:var(--ink-2)}
.status{display:inline-flex;align-items:center;gap:4px;font:500 12px/16px var(--font);white-space:nowrap}
.status.copied{color:var(--warn)} .status.failed{color:var(--err)} .status.ok{color:var(--ok)}

/* Surfaces & lists */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.group{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;position:relative}
.group .row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.group .row.ind+.row.ind::before{left:54px}
.row .tx{flex:1;min-width:0}
.row .tx .a{font:500 15px/20px var(--font)}
.row .tx .b{font:400 13px/18px var(--font);color:var(--ink-3);margin-top:2px}
.row .val{font:400 14px/20px var(--font);color:var(--ink-3);white-space:nowrap}
.row .lead{width:24px;color:var(--ink-2);display:grid;place-items:center}
.sec-l{padding:20px 20px 8px;font:600 13px/18px var(--font);color:var(--ink-3)}
.pad{padding-inline:20px}
.hr{height:1px;background:var(--line)}

/* Toggle */
.tg{width:52px;height:32px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;border:2px solid var(--line-2)}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--ink-3)}
.tg.on{background:var(--accent);border-color:var(--accent)}
.tg.on::after{left:24px;background:var(--on-accent)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;position:relative}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}

/* Progress */
.prog{height:4px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.ring{--p:62;width:36px;height:36px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";grid-area:1/1;width:30px;height:30px;border-radius:50%;background:var(--surface)}
.ring>*{grid-area:1/1;position:relative;color:var(--ink)}

/* Segmented control */
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:999px;font:500 14px/18px var(--font);color:var(--ink-2);white-space:nowrap;padding:0 12px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

/* Search */
.search{height:48px;border-radius:999px;background:var(--surface-2);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;color:var(--ink-3);font:400 15px/20px var(--font)}
.search.act{background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.search .q{flex:1;color:var(--ink);min-width:0}
.caret{display:inline-block;width:2px;height:20px;background:var(--accent);vertical-align:-4px;margin-left:1px}

/* Snackbar & sheet */
.snack{position:absolute;left:12px;right:12px;bottom:84px;background:var(--inverse);color:var(--on-inverse);border-radius:var(--r-md);min-height:52px;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;box-shadow:var(--sh-2);z-index:20;font:400 14px/20px var(--font)}
.snack .btn{color:var(--inverse-accent);height:40px;padding:0 12px}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:31;padding:8px 0 20px;box-shadow:var(--sh-3)}
.sheet .hd{width:32px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 12px}
.inner .sheet.side{left:auto;top:36px;bottom:20px;width:420px;border-radius:var(--r-xl) 0 0 var(--r-xl)}
.dialog{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:var(--r-xl);padding:24px;z-index:31;box-shadow:var(--sh-3)}
.inner .dialog{left:50%;right:auto;width:400px;transform:translate(-50%,-50%)}

/* App tiles (host app identity in History). Real build uses the app's launcher icon. */
.tile{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font:600 10px/1 var(--font);color:#fff;flex:none}
.tile.lg{width:36px;height:36px;border-radius:10px;font-size:15px}

/* History */
.hist-note{display:flex;gap:10px;align-items:flex-start;padding:4px 20px 12px;color:var(--ink-3);font:400 13px/18px var(--font)}
.day{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 8px;gap:12px}
.day .d{font:600 15px/20px var(--font);color:var(--ink)}
.day .n{font:400 13px/18px var(--font);color:var(--ink-3);white-space:nowrap}
.day .exp{font:500 12px/16px var(--font);color:var(--warn);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.ent{display:block;padding:12px 20px 14px;position:relative;text-align:left;width:100%}
.ent+.ent::before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--line)}
.ent .m{display:flex;align-items:center;gap:8px;font:500 13px/18px var(--font);color:var(--ink-2)}
.ent .m .tm{font:400 12px/16px var(--mono);color:var(--ink-3)}
.ent .m .sp{flex:1}
.ent .x{font:400 15px/22px var(--font);color:var(--ink);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ent .x.muted{color:var(--ink-3)}
.ent.sel{background:var(--accent-soft)}
.ent.sel::before,.ent.sel+.ent::before{display:none}
mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 1px}
.diff-del{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--err)}
.diff-ins{color:var(--accent-ink);background:var(--accent-soft);border-radius:3px;padding:0 1px}

/* Audio player */
.player{display:flex;min-width:0;align-items:center;gap:12px;padding:10px 14px 10px 10px;background:var(--surface-2);border-radius:var(--r-md)}
.player .pb{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.wave{flex:1;display:flex;align-items:center;justify-content:space-between;gap:2px;height:32px;min-width:0;overflow:hidden}
.wave i{flex:none;width:2.5px;border-radius:2px;background:var(--ink-4)}
.wave i.p{background:var(--ink)}

/* Dashboard */
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:140px}
.chart .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.chart .bar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--surface-3)}
.chart .bar.t{background:var(--accent)}
.chart .lb{font:500 12px/16px var(--font);color:var(--ink-3)}
.chart .lb.t{color:var(--ink)}
.metric{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0}
.metric+.metric{border-top:1px solid var(--line)}
.metric .k{font:500 15px/20px var(--font)}
.metric .e{font:400 13px/18px var(--font);color:var(--ink-3);margin-top:2px}
.metric .v{font:600 20px/24px var(--font);letter-spacing:-.3px;white-space:nowrap;text-align:right}
.metric .v small{font:500 13px/16px var(--font);color:var(--ink-3);letter-spacing:0;margin-left:2px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font:400 13px/18px var(--font);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.approw{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0}
.approw .nm{font:500 14px/20px var(--font)}
.approw .w{font:400 13px/18px var(--mono);color:var(--ink-3)}
.approw .br{grid-column:2/4;height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.approw .br i{display:block;height:100%;background:var(--ink-2);border-radius:999px}
.skel{background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:sh 1.4s infinite}
.dark .skel::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@keyframes sh{to{transform:translateX(100%)}}

/* Models */
.mrow{display:flex;gap:12px;padding:16px;align-items:flex-start;position:relative;text-align:left;width:100%}
.group .mrow+.mrow::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.mrow .tx{flex:1;min-width:0}
.mrow .nm{display:flex;align-items:center;gap:8px;font:600 16px/22px var(--font);letter-spacing:-.1px}
.mrow .by{font:400 12px/16px var(--font);color:var(--ink-3);margin-top:1px}
.mrow .spec{font:400 12px/16px var(--mono);color:var(--ink-2);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px}
.mrow .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mrow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.mrow.sel{background:var(--accent-soft)}
.mrow.sel::before,.mrow.sel+.mrow::before{display:none}
.mrow .dl{margin-top:12px}
.mrow .dl .meta{display:flex;justify-content:space-between;font:400 12px/16px var(--mono);color:var(--ink-3);margin-top:6px}
.dlbtn{height:36px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;font:500 13px/16px var(--font);color:var(--ink)}
.inuse{height:24px;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:4px;font:600 11px/14px var(--font);letter-spacing:.2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px}
.kv>div{padding:12px 0;border-top:1px solid var(--line);font:400 14px/20px var(--font)}
.kv>div:nth-child(-n+2){border-top:0}
.kv .k{color:var(--ink-3)}
.kv .v{text-align:right}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r-md);overflow:hidden}
.big4>div{background:var(--surface);padding:14px 16px}
.big4 .n{font:600 26px/30px var(--font);letter-spacing:-.6px}
.big4 .n small{font:500 14px/18px var(--font);color:var(--ink-3);letter-spacing:0;margin-left:3px}
.big4 .l{font:400 12px/16px var(--font);color:var(--ink-3);margin-top:4px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:center;min-height:44px;font:400 14px/20px var(--font)}
.step .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.step.done .ic{background:var(--ok-soft);color:var(--ok)}
.step.now .ic{background:var(--accent-soft);color:var(--accent-ink)}
.step.todo .ic{border:1.5px solid var(--line-2)}
.step.todo{color:var(--ink-3)}
.step .t{flex:1}
.step .r{font:400 12px/16px var(--mono);color:var(--ink-3)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* Banner */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);font:400 14px/20px var(--font)}
.banner.err{background:var(--err-soft);color:var(--ink)}
.banner.err .bi{color:var(--err)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.warn .bi{color:var(--warn)}
.banner.info{background:var(--surface-2)}
.banner b{font-weight:600}
.banner .acts{display:flex;gap:4px;margin:6px 0 -6px -12px}

/* Editor */
.editor{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);padding:14px 14px 10px;font:400 13px/20px var(--mono);color:var(--ink);white-space:pre-wrap}
.editor.err{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.var{font:500 12px/18px var(--mono);color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 3px}

/* Onboarding */
.ob{flex:1;display:flex;flex-direction:column;padding:8px 24px 16px;min-height:0}
.ob .ill{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);margin:28px 0 24px}
.ob .kicker{font:500 13px/18px var(--font);color:var(--ink-3);margin-bottom:8px}
.ob h1{font:600 30px/36px var(--font);letter-spacing:-.6px;text-wrap:balance}
.ob .lead{font:400 16px/24px var(--font);color:var(--ink-2);margin-top:12px;text-wrap:pretty}
.ob .why{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.ob .why>div{display:flex;gap:12px;font:400 15px/22px var(--font);color:var(--ink)}
.ob .why .i{color:var(--ink-2);margin-top:-1px}
.ob .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:16px}
.ob .fine{font:400 13px/18px var(--font);color:var(--ink-3);text-align:center;padding:8px 8px 0}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line-2)}
.dots i.on{width:20px;background:var(--ink)}
.dots i.done{background:var(--ink-3)}
.sysbox{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.sysbox .h{font:500 12px/16px var(--font);color:var(--ink-3)}
.ob-l{width:300px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:28px 24px;display:flex;flex-direction:column;gap:28px}
.vstep{display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.vstep .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font:600 13px/1 var(--font)}
.vstep.done .ic{background:var(--ok-soft);color:var(--ok)}
.vstep.now .ic{background:var(--ink);color:var(--bg)}
.vstep.todo .ic{border:1.5px solid var(--line-2);color:var(--ink-3)}
.vstep .a{font:500 15px/20px var(--font)}
.vstep.todo .a{color:var(--ink-3)}
.vstep .b{font:400 13px/18px var(--font);color:var(--ink-3);margin-top:2px}

/* ---------- Host apps (for the bubble) ---------- */
.host{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface);position:relative}
.h-top{display:flex;align-items:center;gap:10px;padding:6px 12px 8px 8px;border-bottom:1px solid var(--line);flex:none}
.h-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 14px/1 var(--font);color:#fff;background:#5B7C99;flex:none}
.h-msgs{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 12px 12px;background:var(--bg);overflow:hidden}
.msg{max-width:78%;padding:9px 12px 8px;border-radius:18px;font:400 15px/21px var(--font);position:relative}
.msg.in{background:var(--surface);align-self:flex-start;border-bottom-left-radius:6px;box-shadow:var(--sh-1)}
.msg.out{background:var(--surface-3);align-self:flex-end;border-bottom-right-radius:6px}
.msg .tm{font:400 11px/14px var(--font);color:var(--ink-3);float:right;margin:6px 0 -2px 10px}
.h-input{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 12px;background:var(--surface);border-top:1px solid var(--line);flex:none}
.h-field{flex:1;min-height:44px;border-radius:22px;background:var(--surface-2);padding:11px 16px;font:400 15px/22px var(--font);color:var(--ink);min-width:0}
.h-field .ph{color:var(--ink-3)}
.h-send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.kb{flex:none;background:var(--kb);padding:6px 4px 4px;display:flex;flex-direction:column;gap:8px}
.kb .sug{display:flex;justify-content:space-around;height:32px;align-items:center;font:400 15px/20px var(--font);color:var(--ink-2)}
.kb .sug span+span{border-left:1px solid var(--key-2);padding-left:24px}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb .k{height:44px;flex:1;max-width:36px;background:var(--key);border-radius:6px;display:grid;place-items:center;font:400 18px/1 var(--font);color:var(--ink);box-shadow:0 1px 0 var(--key-2)}
.kb .k.w{max-width:52px;flex:1.5;font-size:13px;background:var(--key-2)}
.kb .k.sp{max-width:none;flex:5;font-size:13px;color:var(--ink-3)}
.inner .kb{padding:6px 24px 6px}.inner .kb .k{max-width:64px;height:44px}.inner .kb .k.sp{flex:9;max-width:none}.inner .kb .k.w{max-width:96px}
.inner .kb .k.w{max-width:84px}

/* Notes-like host on inner display */
.n-list{width:280px;flex:none;border-right:1px solid var(--line);background:var(--bg);padding:8px 0;overflow:hidden}
.n-item{padding:12px 20px;border-bottom:1px solid var(--line)}
.n-item .a{font:600 14px/20px var(--font)}
.n-item .b{font:400 13px/18px var(--font);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-item.on{background:var(--surface)}
.n-doc{flex:1;padding:24px 32px;min-width:0;font:400 16px/26px var(--font)}
.n-doc h2{font:600 24px/30px var(--font);letter-spacing:-.3px;margin-bottom:12px}

/* ---------- The bubble ---------- */
.bub-layer{position:absolute;inset:0;pointer-events:none;z-index:40}
.bub-layer>*{pointer-events:auto}
.bub{position:absolute;height:52px;border-radius:26px;display:flex;align-items:center;gap:10px;font:600 14px/18px var(--font);white-space:nowrap;transition:width .28s cubic-bezier(.2,0,0,1),background-color .2s}
.bub.circle{width:52px;justify-content:center;padding:0}
.bub.ready{background:var(--surface);color:var(--ink);box-shadow:var(--sh-2),0 0 0 1px var(--line)}
.dark .bub.ready{box-shadow:var(--sh-2),0 0 0 1px var(--line-2)}
.bub.listen{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh-2);padding:0 6px 0 16px;width:164px}
.bub.work{background:var(--inverse);color:var(--on-inverse);box-shadow:var(--sh-2);padding:0 18px 0 16px}
.bub.done{background:var(--surface);color:var(--ink);box-shadow:var(--sh-2),0 0 0 1px var(--line);padding:0 18px 0 14px}
.bub.err{background:var(--surface);color:var(--ink);box-shadow:var(--sh-2),0 0 0 1px var(--line);padding:0 6px 0 14px}
.bub.tab{width:22px;height:60px;border-radius:12px 0 0 12px;background:var(--inverse);color:var(--on-inverse);justify-content:center;box-shadow:var(--sh-1);opacity:.92}
.bub.tab.left{border-radius:0 12px 12px 0}
.bub.lift{transform:scale(1.08);box-shadow:var(--sh-3),0 0 0 1px var(--line)}
.bub .lvl{display:flex;align-items:center;gap:3px;height:24px}
.bub .lvl i{width:3px;border-radius:2px;background:currentColor;display:block}
.bub .tmr{font:500 14px/18px var(--mono);font-variant-numeric:tabular-nums;flex:1}
.bub .stop{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.dark .bub .stop{background:rgba(11,16,51,.16)}
.bub .act{height:40px;padding:0 14px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;font:600 13px/16px var(--font);color:var(--ink)}
.bub-x{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;box-shadow:var(--sh-2),0 0 0 1px var(--line)}
.dots3{display:flex;gap:4px}
.dots3 i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;animation:d3 1.2s infinite}
.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
@keyframes d3{30%{opacity:1}60%{opacity:.35}}
.lvl.live i{animation:lv .9s ease-in-out infinite alternate}
.lvl.live i:nth-child(2){animation-duration:.7s}.lvl.live i:nth-child(3){animation-duration:.55s}.lvl.live i:nth-child(4){animation-duration:.8s}.lvl.live i:nth-child(5){animation-duration:.65s}
@keyframes lv{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.prog-line{width:52px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden;position:relative}
.dark .prog-line{background:rgba(0,0,0,.15)}
.prog-line i{position:absolute;inset:0 auto 0 0;background:currentColor;border-radius:2px}
.target{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.target .c{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);box-shadow:var(--sh-2),0 0 0 1px var(--line-2)}
.target .c.hot{background:var(--ink);color:var(--bg);transform:scale(1.12)}
.target .lbl{background:var(--inverse);color:var(--on-inverse);font:500 13px/16px var(--font);padding:6px 12px;border-radius:999px}
.guide{position:absolute;top:60px;bottom:340px;width:0;border-left:2px dashed var(--accent);opacity:.55}
.ghost{position:absolute;width:52px;height:52px;border-radius:50%;border:2px dashed var(--accent);opacity:.8}
.trail{position:absolute;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px);opacity:.6;transform-origin:left center}
.note{position:absolute;background:var(--inverse);color:var(--on-inverse);font:500 12px/16px var(--font);padding:6px 10px;border-radius:8px;white-space:nowrap}

/* Bubble state board */
.bboard{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--line)}
.bcell{background:var(--bg);padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;min-height:200px;position:relative;margin:0 1px 1px 0}
.bcell .stage{height:84px;position:relative;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.bcell .stage .bub{right:12px;top:16px}
.bcell .stage .bub.tab{right:0;top:12px}
.bcell .nm{font:600 15px/20px var(--font)}
.bcell .ds{font:400 13px/18px var(--font);color:var(--ink-2)}
.bcell .mx{font:400 11px/16px var(--mono);color:var(--ink-3);margin-top:auto}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

   case 'trans': return `<div class="bub work" ${S} role="status">${lvl([6,10,14,10,6],false).replace('class="lvl"','class="lvl" style="opacity:.6"')}<span>Transcribing</span></div>`;
   case 'polish': return `<div class="bub work" ${S} role="status"><span class="dots3"><i></i><i></i><i></i></span><span>Polishing</span></div>`;
   case 'ok': return `<div class="bub done" ${S} role="status"><span style="color:var(--ok)">${I('check',20,'b2')}</span><span>Inserted</span></div>`;
   case 'copied': return `<div class="bub done" ${S} role="status"><span style="color:var(--accent-ink)">${I('clip',20)}</span><span>Copied. Paste it anywhere</span></div>`;
   case 'err': return `<div class="bub err" ${S} role="alert"><span style="color:var(--err)">${I('alert',20)}</span><span>Didn't catch that</span><span class="act">Retry</span></div>`;
  }
}
// cover coordinates: bubble 52px; screen 412 wide; right margin 8
function bubbleScene(d,state){
  const W=d==='cover'?412:750;
  const fieldMap={listen:'Привет! Буду в офисе к 11,',ok:'Привет! Буду в офисе к 11, созвон с Сашей переносим на четверг. Скинь, пожалуйста, ссылку на документ.'};
  const width={ready:52,lift:52,listen:164,hold:212,trans:166,polish:146,ok:132,copied:252,err:244,tab:22}[state];
  const right=state==='tab'?0:8;
  const x=W-right-width;
  const host=state==='copied'?readerHost(d):d==='cover'?chatHost(d,{field:fieldMap[state]||'',kb:true}):notesHost(d,{text:fieldMap[state]||'',kb:true});
  /* data-dock: vertical position is computed after render, 12 dp above the focused field
     (cover) or above the keyboard (inner). Copied-only has no field: it keeps its last y. */
  const dock=state==='copied'?'data-dock-y="520"':'data-dock="1"';
  const extra=(state==='listen')?`<button class="bub-x" data-dock="1" data-dy="-50" style="right:${right+4}px" aria-label="Cancel and discard">${I('x',20)}</button>`:'';
  const b=bubbleHTML(state,`right:${right}px`).replace(/^<(\w+) /,`<$1 ${dock} `);
  return `${statusBar(d)}<div class="app" style="position:relative">${host}</div>${gesture()}<div class="bub-layer">${extra}${b}</div>`;
}
function placeBubbles(scope){
  scope.querySelectorAll('[data-screen]').forEach(scr=>{
    const sr=scr.getBoundingClientRect();
    const anchor=scr.querySelector('.h-input')||scr.querySelector('.kb');
    scr.querySelectorAll('[data-dock],[data-dock-y]').forEach(el=>{
      const h=el.classList.contains('tab')?60:52;
      let top;
      if(el.dataset.dockY) top=+el.dataset.dockY;
      else if(anchor) top=(anchor.getBoundingClientRect().top-sr.top)/1-12-h;
      else top=500;
      // gallery frames are 1:1, so client px == dp
      el.style.top=(top+(+(el.dataset.dy||0)))+'px';
    });
  });
}
function readerHost(d){
  return `<div class="host"><div class="h-top"><button class="ib">${I('back')}</button><div style="flex:1;min-width:0;height:40px;border-radius:20px;background:var(--surface-2);display:flex;align-items:center;padding:0 14px;gap:8px" class="t-b c2">${I('lock',16)}<span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">habr.com/ru/articles/on-device-asr</span></div><button class="ib">${I('more')}</button></div>
   <div style="padding:20px 20px;flex:1;overflow:hidden;background:var(--surface)"><div class="t-over">Статья · 8 мин</div><h2 style="font:700 26px/32px var(--font);margin-top:10px;letter-spacing:-.4px">Распознавание речи на телефоне: что изменилось за год</h2>
   <p class="t-bl c2" style="margin-top:14px">Ещё недавно для качественной диктовки нужен был облачный сервис. Сейчас модели на 0,6–1 млрд параметров работают на NPU телефона быстрее реального времени.</p>
   <p class="t-bl c2" style="margin-top:12px">Главный вопрос теперь не скорость, а память: модель должна загружаться за доли секунды и освобождать RAM сразу после использования.</p>
   <p class="t-bl c2" style="margin-top:12px">Мы сравнили пять моделей на русском и английском…</p></div></div>`;
}
function dragScene(d){
  const W=d==='cover'?412:750, H=d==='cover'?960:832;
  const bx=d==='cover'?190:360, by=d==='cover'?520:430;
  const snapX=W-8-52;
  const host=d==='cover'?chatHost(d,{kb:false}):notesHost(d,{focused:false});
  return `${statusBar(d)}<div class="app" style="position:relative">${host}</div>${gesture()}<div class="bub-layer">
    <div style="position:absolute;inset:0;background:var(--scrim);opacity:.35"></div>
    <div class="guide" style="left:8px;top:80px;bottom:200px"></div><div class="guide" style="left:${W-10}px;top:80px;bottom:200px"></div>
    <div class="ghost" style="left:${snapX}px;top:${by}px"></div>
    <div class="trail" style="left:${bx+60}px;top:${by+26}px;width:${snapX-bx-64}px"></div>
    <div class="note" style="left:${snapX-150}px;top:${by-40}px">Snaps to the nearer edge</div>
    ${bubbleHTML('lift',`left:${bx}px;top:${by}px`)}
    <div class="target" style="bottom:56px"><div class="c">${I('x',28)}</div><span class="lbl">Drag here to hide for 1 hour</span></div>
  </div>`;
}
function hideToastScene(d){
  const host=d==='cover'?chatHost(d,{kb:true}):notesHost(d,{kb:true});
  return `${statusBar(d)}<div class="app" style="position:relative">${host}</div>${gesture()}<div class="bub-layer"><div class="snack" style="bottom:${d==='cover'?320:330}px;left:${d==='inner'?'auto':'12px'};right:12px;${d==='inner'?'width:380px':''}"><span style="flex:1">Bubble hidden until 15:32</span><button class="btn">Undo</button></div></div>`;
}

/* ================= Bubble state board ================= */
function bubbleBoard(){
  const cells=[
   ['tab','Rest','Field focused, idle for 4 s. Tucks into an edge tab so it never covers text.','22 × 60 dp · hit area 48 × 60'],
   ['ready','Ready','A text field is focused. Tap to start, hold for push-to-talk, drag to move.','52 dp · hit area 56 dp'],
   ['listen','Listening','Live level from the mic, elapsed time. Tap anywhere on it to finish.','164 × 52 dp · cancel 40 dp above'],
   ['hold','Hold to talk','While the finger is down. Lifting finishes, sliding off cancels.','auto width, 52 dp'],
   ['trans','Transcribing','Shown only if text isn\'t ready within 300 ms of stop.','auto width, 52 dp'],
   ['polish','Polishing','Cleanup model is rewriting. Skipped when cleanup is None.','auto width, 52 dp'],
   ['ok','Inserted','Text is in the field and on the clipboard. Collapses after 1.2 s.','auto width · success tick haptic'],
   ['copied','Copied only','No editable field to type into. Stays 4 s, tap opens the entry.','auto width · max 280 dp'],
   ['err','Error','Plain reason plus one action. See DESIGN.md for every error.','auto width · max 280 dp'],
   ['lift','Dragging','Lifts 1.08×, shows the hide target at the bottom. Snaps to an edge on release.','spring 400 / 0.8'],
  ];
  return `<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:20px"><div><div class="t-over">Component</div><h2 class="t-h1" style="margin-top:4px">Bubble states</h2></div><p class="t-b c2" style="max-width:52ch">The bubble is the product. It shows exactly one thing at a time, grows from the edge it is docked to, and never shows a spinner without a word next to it.</p></div>
   <div class="bboard" style="grid-template-columns:repeat(5,300px);width:max-content">${cells.map(([s,n,dsc,mx])=>`<div class="bcell"><div class="stage">${bubbleHTML(s,s==='tab'?'right:0;top:12px':'right:12px;top:16px')}${s==='listen'?'':''}</div><div><div class="nm">${n}</div><div class="ds" style="margin-top:4px">${dsc}</div></div><div class="mx">${mx}</div></div>`).join('')}</div>`;
}

/* ================= Frame registry ================= */

const NAV_TARGET={dash:'dash',hist:'hist',models:'models',settings:'settings'};
const byId=Object.fromEntries(F.map(f=>[f.id,f]));
const SEC_NOTE={
 Onboarding:'Five permission steps and a model download. Each step says what the permission is for, what it is not used for, and what Android will show next. The inner display keeps the whole checklist visible on the left.',
 Bubble:'The floating bubble over real apps, at 1:1 dp. Cover display shows a messenger with the Samsung keyboard open; the inner display shows a two-pane notes app. Tap the bubble in “Ready” to run the live demo.',
 Dashboard:'Numbers that change behaviour: how much you dictate, how fast text arrives, where insertion fails. All computed on the phone.',
 History:'The main tab. Grouped by day, with the retention rule stated once at the top and the day that is about to be deleted marked. Inner display uses list-detail.',
 Models:'Speech and cleanup models. Parameters, languages and sizes come from the Hugging Face model cards; benchmark numbers are sample values, not measurements.',
 Settings:'Retention, bubble behaviour, the cleanup prompt with reset, tone per app, privacy and permission health.',
};

/* ================= Render ================= */
function frameHTML(f,d,dark){
  const cls=`screen ${d}${dark?' dark':''}`;
  return `<div class="frame ${d}" data-frame="${f.id}" data-dev="${d}"><div class="${cls}" data-screen>${f.render(d)}</div></div>`;
}
const params=new URLSearchParams(location.search);
const root=document.getElementById('root');
function renderGallery(){
  const secs=[...new Set(F.map(f=>f.sec))];
  const forceDark=document.documentElement.dataset.devtheme==='dark';
  root.innerHTML=`<header class="g-head"><div><h1>Murmur prototype</h1><p>On-device dictation for Galaxy Z Fold7. Every screen at both sizes: cover display 412 × 960 dp and inner display 750 × 832 dp, shown at 1 px = 1 dp. Spec in <code>DESIGN.md</code>, tokens in <code>tokens.json</code>.</p></div>
   <div class="g-ctrl"><button id="tLight" aria-pressed="${!forceDark}">Light app</button><button id="tDark" aria-pressed="${forceDark}">Dark app</button></div></header>
   <nav class="g-toc">${secs.map(s=>`<a href="#${s.toLowerCase()}">${s}</a>`).join('')}</nav>`+
   secs.map(s=>`<section class="g-sec" id="${s.toLowerCase()}"><h2>${s}</h2><p>${SEC_NOTE[s]||''}</p>`+
     F.filter(f=>f.sec===s).map(f=>`<div class="g-scroll" style="margin-bottom:40px"><div class="g-cap"><b>${f.title}</b><code>${f.id}</code></div><div class="g-row" style="margin-top:10px">${f.devs.map(d=>`<div class="g-item">${frameHTML(f,d,forceDark||f.dark)}<div class="g-cap">${d==='cover'?'Cover display':d==='inner'?'Inner display':''}</div></div>`).join('')}</div></div>`).join('')+`</section>`).join('');
  document.getElementById('tLight').onclick=()=>{document.documentElement.dataset.devtheme='light';renderGallery();placeBubbles(root)};
  document.getElementById('tDark').onclick=()=>{document.documentElement.dataset.devtheme='dark';renderGallery();placeBubbles(root)};
}
function renderSolo(id,dev,dark){
  document.body.classList.add('solo');
  const f=byId[id];
  root.innerHTML=frameHTML(f,dev,dark||f.dark);
}
if(params.get('frame')) renderSolo(params.get('frame'),params.get('dev')||'cover',params.get('theme')==='dark');
else renderGallery();
const replace=()=>placeBubbles(root);
replace(); if(document.fonts) document.fonts.ready.then(replace);

/* ================= Interactions ================= */
root.addEventListener('click',ev=>{
  const nav=ev.target.closest('[data-nav]'), go=ev.target.closest('[data-go]');
  const frame=ev.target.closest('[data-frame]'); if(!frame) return;
  const scr=frame.querySelector('[data-screen]'); const d=frame.dataset.dev;
  let id=null;
  if(nav) id=NAV_TARGET[nav.dataset.nav];
  else if(go&&go.dataset.go) id=go.dataset.go;
  if(id&&byId[id]&&byId[id].devs.includes(d)){ scr.innerHTML=byId[id].render(d); placeBubbles(frame); return; }
  if(id==='hist-detail'&&d==='inner'){ scr.innerHTML=byId['hist'].render(d); return; }
  if(id==='model-detail'&&d==='inner'){ scr.innerHTML=byId['models'].render(d); return; }
  // Live bubble demo: tap the Ready bubble
  const b=ev.target.closest('.bub.ready.circle');
  if(b&&frame.dataset.frame==='b-ready') runDemo(scr,d);
});
let demoTimer=[];
function runDemo(scr,d){
  demoTimer.forEach(clearTimeout); demoTimer=[];
  const seq=[['listen',0],['trans',2600],['polish',3300],['ok',4300],['ready',5600]];
  seq.forEach(([s,t])=>demoTimer.push(setTimeout(()=>{scr.innerHTML=bubbleScene(d,s); placeBubbles(scr.parentElement);},t)));
}
</script>
